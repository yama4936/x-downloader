services:
  - type: web
    name: twitterno
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 40 --no-proxy-headers
    healthCheckPath: /health
    domains:
      - x.yama.asia
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
